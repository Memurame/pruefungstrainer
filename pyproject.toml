[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pruefungstrainer"
version = "0.5.0"
description = "Probeprüfungen aus Obsidian-Notizen und PDFs, Fragen per Claude generiert"
requires-python = ">=3.11"
dependencies = ["anthropic>=1.0", "PySide6", "pymupdf", "pydantic>=2"]

[project.scripts]
pruefungstrainer = "pruefungstrainer.app:main"

[tool.setuptools.packages.find]
where = ["src"]
